<script>
class MyRouter extends HTMLElement {
  constructor() {
    super();
  }
  #currentPage = null;
  #pages = null;
  #controller = null;

  #showPage(page) {
    this.#pages.forEach((pageEl) => pageEl.style.display = 'none');
    this.#pages.get(page).style.display = 'block';
    this.#currentPage = page;
  }
  #addPages() {
    [...this.children].forEach((page) => {
      this.#pages.set(page.id, page);
    });
  }
  #addClickHandler() {
    document.addEventListener("click", (event) => {
      if (event.target.tagName !== "A") return;
      let newPage = event.target.getAttribute("href");
      if(!newPage.startsWith('#')) return;
      event.preventDefault();
      newPage = newPage.replace('#', '');
      if (this.handler) {
        this.handler(
          () => {
            if (this.#pages.has(newPage)) this.#showPage(newPage);
          },
          { previous: this.#currentPage, next: newPage }
        );
      } else {

        if (this.#pages.has(newPage)) this.#showPage(newPage);
      }
    }, {singal: this.#controller.signal});
  }
  connectedCallback() {
    this.#pages = new Map();
    this.#controller = new AbortController();
    this.#addPages();
    this.#showPage(this.getAttribute("initial-route"));
    this.#addClickHandler();
  }
  
  disconnectedCallback() {
    this.#controller.abort();
  }
}

customElements.define("my-router", MyRouter);

// Variable to store the intercepted browser prompt
let deferredPrompt; 
const installBtn = document.getElementById('install-btn');

// 1. Listen for the browser's built-in install invitation
window.addEventListener('beforeinstallprompt', (e) => {
  // Prevent older Chrome versions from automatically showing the prompt
  e.preventDefault();
  
  // Save the event so it can be triggered later
  deferredPrompt = e;
  
  // Unhide your custom install button
  installBtn.style.display = 'block';
});

// 2. Handle the user clicking your custom button
installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  
  // Show the native browser install prompt
  deferredPrompt.prompt();
  
  // Wait for the user to accept or dismiss the prompt
  const { outcome } = await deferredPrompt.userChoice;
  console.log(`User response to the install prompt: ${outcome}`);
  
  // Reset the deferred prompt variable; it can only be used once
  deferredPrompt = null;
  
  // Hide your custom button again
  installBtn.style.display = 'none';
});

// 3. Optional: Hide button if the app is successfully installed
window.addEventListener('appinstalled', () => {
  console.log('PWA was successfully installed!');
  installBtn.style.display = 'none';
  deferredPrompt = null;
});

// Check if the app is running standalone (installed)
if (window.matchMedia('(display-mode: standalone)').matches) {
  installBtn.style.display = 'none';
  document.getElementById('welcome-display').style.display = 'none';
